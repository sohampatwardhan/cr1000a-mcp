[project]
name = "cr1000a-mcp"
version = "0.2.0"
description = "MCP server for the Verizon CR1000A (Fios) router"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["mcp", "verizon", "fios", "cr1000a", "router"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Networking",
]
authors = [
    { name = "Soham Patwardhan", email = "39222082+sohampatwardhan@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=4.2.1",
    "python-dotenv>=1.2.4",
    "verizon-router-client>=0.4.0,<0.5",
]

[project.urls]
Homepage = "https://github.com/sohampatwardhan/cr1000a-mcp"
Issues = "https://github.com/sohampatwardhan/cr1000a-mcp/issues"
Changelog = "https://github.com/sohampatwardhan/cr1000a-mcp/blob/main/CHANGELOG.md"
Documentation = "https://github.com/sohampatwardhan/cr1000a-mcp/blob/main/docs/endpoints.md"

[project.scripts]
cr1000a-mcp = "cr1000a_mcp:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
