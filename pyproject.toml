[project]
name = "cr1000a-mcp"
version = "0.1.0"
description = "MCP server for the Verizon CR1000A (Fios) router"
readme = "README.md"
authors = [
    { name = "Soham Patwardhan", email = "39222082+sohampatwardhan@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=4.2.1",
    "python-dotenv>=1.2.4",
    "verizon-router-client>=0.4.0",
]

[project.scripts]
cr1000a-mcp = "cr1000a_mcp:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
